[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "running-data"
version = "0.1.0"
description = "Data-Wrangling-Pipeline für Laufdaten aus Garmin Connect und Apple Health"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Manna" },
    { name = "Makaratzis" },
]

# Laufzeit-Abhängigkeiten. Bewusst deckungsgleich mit requirements.txt gehalten:
# requirements.txt pinnt exakte Versionen für die reproduzierbare Abgabe,
# hier stehen die minimal nötigen Untergrenzen für die Installation als Paket.
dependencies = [
    "pandas>=2.3",
    "numpy>=2.3",
    "lxml>=6.0",
    "pyarrow>=22.0",
    "snakemake>=9.25",
]

# Entwicklungswerkzeuge. Spiegelt requirements-dev.txt, analog zum Verhältnis
# von dependencies und requirements.txt: hier Untergrenzen, dort exakte Pins.
[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "pytest-cov>=7.0",
    "black>=26.0",
    "ruff>=0.16",
    "mypy>=2.0",
    "nbclient>=0.11",
    "ipykernel>=7.0",
]

[tool.setuptools.packages.find]
# Das Paket liegt unter src/ (src-Layout). Dadurch kann der Code nur über eine
# echte Installation importiert werden und nie versehentlich über das
# aktuelle Arbeitsverzeichnis — das verhindert stille Import-Fehler.
where = ["src"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]
ignore = []

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Damit "pytest" auch ohne vorheriges "pip install -e ." funktioniert: Das
# src-Verzeichnis kommt auf den Importpfad. Bei installiertem Paket ist die
# Angabe wirkungslos, weil der Import ohnehin gelingt.
pythonpath = ["src"]
addopts = "--strict-markers -q"

[tool.coverage.run]
source = ["src/running_data"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
